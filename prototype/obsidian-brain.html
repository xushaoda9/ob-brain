function groups(id){
 const result={parent:[],child:[],jump:[],sibling:[]};
 const jumps=new Set();
 for(const edge of state.edges){
  if(edge.from!==id&&edge.to!==id)continue;
  const outgoing=edge.from===id;
  const n=find(outgoing?edge.to:edge.from);
  if(!n||n.id===id)continue;
  if(edge.type==='parent')result[outgoing?'child':'parent'].push({n,edge});
  if(edge.type==='jump'&&!jumps.has(n.id)){
   jumps.add(n.id);
   result.jump.push({n,edge});
  }

 const parentById=new Map(result.parent.map(({n})=>[n.id,n]));

 for(const edge of state.edges){
  const parent=parentById.get(edge.from);
  if(edge.type!=='parent'||!parent||edge.to===id||edge.to===parent.id)continue;
  const n=find(edge.to);
  if(!n)continue;
  if(!siblings.has(n.id))siblings.set(n.id,{n,parents:new Map()});
  siblings.get(n.id).parents.set(parent.id,parent);

}

function paint(entries){
 const canvas=$('edges'),ctx=canvas.getContext('2d');
 const w=extent.x+8,h=extent.y+8,d=Math.min(devicePixelRatio||1,2,1600/Math.max(w,h));
 canvas.width=Math.ceil(2*w*d);canvas.height=Math.ceil(2*h*d);
 Object.assign(canvas.style,{left:-w+'px',top:-h+'px',width:2*w+'px',height:2*h+'px'});
 ctx.setTransform(d,0,0,d,w*d,h*d);
 for(const {x,y,group} of entries){
  const jump=group==='jump', sibling=group==='sibling';
  const side=jump||sibling,sign=Math.sign(side?x:y);
  const start=side?[sign*90,0]:[0,sign*32], end=side?[x-sign*72,y]:[x,y-sign*22];
  ctx.beginPath();ctx.moveTo(...start);
  if(side)ctx.bezierCurveTo(sign*128,0,end[0]-sign*26,y,...end);
  else{const middle=(start[1]+end[1])/2;ctx.bezierCurveTo(0,middle,x,middle,...end);}
  ctx.strokeStyle=tones[group]+(sibling?'db':'9c');
  ctx.lineWidth=sibling?1.8:1.4;
  ctx.setLineDash(jump?[4,5]:sibling?[2,4]:[]);
  ctx.stroke();ctx.setLineDash([]);
  if(jump){
   for(const [point,direction] of [[start,sign],[end,-sign]]){
    const [px,py]=point;
    ctx.beginPath();ctx.moveTo(px+direction*7,py-4);ctx.lineTo(px,py);ctx.lineTo(px+direction*7,py+4);ctx.stroke();
   }
  }else{
   for(const point of [start,end]){ctx.beginPath();ctx.arc(...point,2.6,0,Math.PI*2);ctx.fillStyle=tones[group];ctx.fill();}
  }

}

function getEdge(source,target,kind){

function linkIssue(edge,edges=state.edges){

 const target=conflict?'work':edge?(edge.from===source.id?edge.to:edge.from):'';
 if(!others.length){openDialog('连接节点','从「'+esc(source.name)+'」建立一条关系。','<p class="quiet">知识库还没有其他节点。请先创建一个节点。</p><button class="primary" data-action="newChild" data-id="'+source.id+'" type="button">新建节点</button>');return;}
 const body=choices('目标节点','target',[['','请选择目标节点'],...others.map(n=>[n.id,n.name+' · '+n.path])])+choices('关系类型','kind',relationOptions)+'<p class="quiet">跳转节点显示在左侧。同级节点根据共同父节点自动显示在右侧。</p>';
 const submit=data=>{
  const target=data.get('target');
  if(!find(target))return '请选择目标节点。';
  const updated=getEdge(source.id,target,data.get('kind'));
  const issue=linkIssue(updated,state.edges.filter(e=>e!==edge));
  if(issue)return issue;
  if(edge)Object.assign(edge,updated);else state.edges.push(updated);
  dialog.close();render();toast(edge?'关系已更新':'节点已连接');
 };
 openDialog(edge?'编辑关系':'连接节点','从「'+esc(source.name)+'」设置与目标节点的关系。',body,edge?'保存关系':'确认连接',submit);
 $('form').elements.target.value=target;
 let kind='child';
 if(edge)kind=edge.type==='parent'?(edge.from===source.id?'child':'parent'):'jump';
 if(conflict)kind='parent';
 $('form').elements.kind.value=kind;
 if(conflict)formError('这两个节点已经有相同的关系。');
}
function manageRelations(node){
 const {sibling,...direct}=groups(node.id);
 const list=Object.entries(direct).flatMap(([group,items])=>items.map(({n,edge})=>{
  const index=state.edges.indexOf(edge);
  const label=groupNames[group];
  return '<div class="row"><span>'+esc(n.name)+' <small class="quiet">· '+label+'</small></span>'+ctl('编辑关系','edit','data-action="edgeEdit" data-id="'+node.id+'" data-index="'+index+'"')+ctl('解除关系','trash','data-action="edgeRemove" data-id="'+node.id+'" data-index="'+index+'"')+'</div>';
 })).join('');
 const siblingRows=sibling.map(({n,parents})=>'<div class="row"><span>'+esc(n.name)+'<small class="quiet parent-context">共同父节点：'+esc(parents.map(parent=>parent.name).join('、'))+'</small></span></div>').join('');
 const siblingSection='<div class="sibling-summary"><strong>同级节点</strong><p class="quiet">根据共同父节点自动计算，可通过修改父子关系调整。</p>'+(siblingRows||'<p class="quiet">暂无同级节点</p>')+'</div>';
 openDialog('管理关系','查看「'+esc(node.name)+'」的直接关系和同级节点。',(list||'<p class="quiet">此节点暂无直接关系。</p>')+siblingSection+'<p><button type="button" class="secondary" data-action="connect" data-id="'+node.id+'">'+icon('plus')+'连接节点</button></p>');
}
function manageRoots(){
 const rows=state.roots.map(find).filter(Boolean).map((n,i)=>{
  const attrs=' data-id="'+n.id+'"';
  return '<div class="row"><i class="dot" style="--dot:'+palette[n.color]+'"></i><span>'+esc(n.name)+'</span>'+
   ctl('向上移动','up','data-action="rootUp"'+attrs+(i===0?' disabled':''))+
   ctl('向下移动','down','data-action="rootDown"'+attrs+(i===state.roots.length-1?' disabled':''))+
   ctl('编辑节点','edit','data-action="rename"'+attrs)+ctl('移除入口','close','data-action="unpin"'+attrs)+'</div>';
 }).join('');
 const free=state.nodes.filter(n=>!state.roots.includes(n.id));
 const add=free.length?choices('添加已有节点','rootId',free.map(n=>[n.id,n.name])):'';
 openDialog('管理一级节点','在顶栏拖动标签排序，或在这里使用上下箭头。',(rows||'<p class="quiet">暂无一级节点。</p>')+(add?'<p></p>'+add:'')+'<p><button type="button" class="secondary" data-action="rootAdd">'+icon('plus')+'新建一级节点</button></p>',add?'固定所选节点':null,data=>{
  const id=data.get('rootId');
  if(find(id)&&!state.roots.includes(id))state.roots.push(id);
  renderNav();persist();manageRoots();toast('已添加一级节点入口');
 });
}
function removeNode(node){
 openDialog('删除节点','「'+esc(node.name)+'」将从图谱、一级栏和历史中移除。','<p class="quiet">与此节点相连的关系会一并解除。Markdown 笔记会保留，可用于后续绑定。</p>','删除节点',()=>{
  const g=groups(node.id);
  const fallback=g.parent[0]?.n.id||g.child[0]?.n.id||state.recent.find(id=>id!==node.id)||state.nodes.find(n=>n.id!==node.id)?.id;
  if(node.body!==null)state.library[node.path]=node.body;
  state.nodes=state.nodes.filter(n=>n.id!==node.id);
  state.edges=state.edges.filter(e=>e.from!==node.id&&e.to!==node.id);
  state.roots=state.roots.filter(id=>id!==node.id);state.recent=state.recent.filter(id=>id!==node.id);
  dialog.close();
  if(state.current===node.id){state.current=null;if(fallback)go(fallback);else render();}else render();
  toast('节点已删除');
 });
}
const menu=$('menu');
function hideMenu(){menu.hidden=true;}
function showMenu(x,y,node,root=false){
 closeSearch();
 const item=(label,glyph,action,danger=false)=>'<button type="button" '+(danger?'class="danger" ':'')+'data-action="'+action+'" data-id="'+esc(node?.id||'')+'">'+icon(glyph)+label+'</button>';
 menu.innerHTML=node?item('打开笔记','file','open')+item('编辑节点','edit','rename')+
 item('新建子节点','plus','newChild')+item('连接已有节点','link','connect')+item('管理关系','sliders','relations')+
 item(root||state.roots.includes(node.id)?'移除一级入口':'固定到一级节点','bookmark',root||state.roots.includes(node.id)?'unpin':'pin')+
 item('删除节点','trash','remove',true):item('新建节点','plus','create')+item('适应画布','fit','fit');
 menu.hidden=false;
 menu.style.left=Math.max(4,Math.min(innerWidth-menu.offsetWidth-5,x))+'px';
 menu.style.top=Math.max(4,Math.min(innerHeight-menu.offsetHeight-5,y))+'px';
 menu.querySelector('button')?.focus({preventScroll:true});
}
function scenarioMenu(){
 const states=[
  ['default','默认图谱','项目管理 · 左侧跳转、右侧同级，团队协作共享两个父节点'],
  ['empty','空白知识库','从零创建第一个一级节点'],
  ['isolated','孤立节点','笔记可打开，图谱暂无直接关系'],
  ['no-results','搜索无结果','演示任意关键词匹配失败的反馈'],
  ['missing','笔记文件失效','重新绑定已有 Markdown 笔记或创建新笔记'],
  ['conflict','关系冲突','尝试保存一条重复的父子关系']
 ];
 const rows=states.map(([id,name,sub])=>'<button type="button" class="scenario" data-action="scenario" data-id="'+id+'"><strong>'+name+'</strong><small>'+sub+'</small></button>').join('');
 openDialog('演示状态','以下场景在独立的演示数据中运行。',rows+(original?'<button type="button" class="secondary" data-action="return">返回我的浏览器数据</button>':''));
}
function loadScenario(id){
 if(dialog.open)dialog.close();
 if(!original)original={state,trail,cursor,nativeTarget};
 state=initial(id==='empty');nativeTarget=null;
 if(id==='missing')state.current='archive';
 if(id==='isolated')state.current='inbox';
 trail=[];cursor=-1;search.value='';closeSearch();resetView();
 if(state.current)go(state.current);else render();
 if(id==='no-results'){search.value='不存在的节点';focusSearch();}
 if(id==='conflict')connectForm(active(),null,true);
}
function restore(){
 if(!original)return;
 if(dialog.open)dialog.close();
 ({state,trail,cursor,nativeTarget}=original);
 original=null;search.value='';closeSearch();resetView();render();
}
function reorderRoot(id,target){
 const from=state.roots.indexOf(id);
 if(from<0||target<0||target>=state.roots.length||from===target)return;
 state.roots.splice(from,1);state.roots.splice(target,0,id);
 renderNav();persist();
}
function handle(action,id,button){
 const n=find(id);
 hideMenu();
 switch(action){
  case 'close':dialog.close();break;
  case 'open':go(id);break;
  case 'create':nodeForm({source:active()});break;
  case 'first':
  case 'rootAdd':nodeForm({root:true});break;
  case 'newChild':nodeForm({source:n});if($('form').elements.relationship)$('form').elements.relationship.value='child';break;
  case 'rename':if(n)nodeForm({node:n});break;
  case 'connect':connectForm(n||active());break;
  case 'relations':if(n)manageRelations(n);break;
  case 'edgeEdit':if(n)connectForm(n,state.edges[Number(button.dataset.index)]);break;
  case 'edgeRemove':{
   const index=Number(button.dataset.index);
   if(!n||!state.edges[index])break;
   state.edges.splice(index,1);render();manageRelations(n);toast('关系已解除');break;
  }
  case 'pin':case 'unpin':
   if(!n)break;
   if(action==='pin'&&!state.roots.includes(id))state.roots.push(id);
   if(action==='unpin')state.roots=state.roots.filter(other=>other!==id);
   renderNav();persist();if(dialog.open)manageRoots();
   toast(action==='pin'?'已固定到一级节点栏':'已移除一级节点入口');break;
  case 'rootUp':case 'rootDown':
   reorderRoot(id,state.roots.indexOf(id)+(action==='rootUp'?-1:1));manageRoots();break;
  case 'remove':if(n)removeNode(n);break;
  case 'search':focusSearch();break;
  case 'rebind':if(active())nodeForm({node:active(),bindOnly:true});break;
  case 'fit':resetView();break;
  case 'scenario':loadScenario(id);break;
  case 'return':restore();break;
 }
}
document.addEventListener('click',event=>{
 const action=event.target.closest('[data-action]');
 if(action){handle(action.dataset.action,action.dataset.id,action);return;}
 if(!event.target.closest('.search'))closeSearch();
 if(!event.target.closest('#menu'))hideMenu();
 const hit=event.target.closest('[data-hit]');
 if(hit){const n=hits[Number(hit.dataset.hit)];if(n){go(n.id);search.blur();}return;}
 const button=event.target.closest('[data-node]');
 if(!button)return;
 if(button.classList.contains('center')){
  const r=button.getBoundingClientRect();
  showMenu(r.right-12,r.bottom+4,active());return;
 }
 go(button.dataset.node);
});
document.addEventListener('contextmenu',event=>{
 const button=event.target.closest('[data-node]');
 if(!button&&!event.target.closest('#viewport'))return;
 event.preventDefault();showMenu(event.clientX,event.clientY,button?find(button.dataset.node):null,!!button?.closest('#roots'));
});
document.addEventListener('keydown',event=>{
 if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'&&!dialog.open){event.preventDefault();focusSearch();}
 if(event.key==='Escape'&&!menu.hidden){event.preventDefault();hideMenu();}
 if(dialog.open)return;
 const button=event.target.closest('[data-node]');
 if(button&&(event.key==='ContextMenu'||event.shiftKey&&event.key==='F10')){
  event.preventDefault();const r=button.getBoundingClientRect();showMenu(r.left,r.bottom,find(button.dataset.node),!!button.closest('#roots'));
 }
});
let draggedRoot=null;
const roots=$('roots');
roots.ondragstart=event=>{
 const chip=event.target.closest('[data-node]');
 if(!chip)return;
 draggedRoot=chip.dataset.node;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',draggedRoot);
};
roots.ondragover=event=>{
 if(!draggedRoot)return;
 const chip=event.target.closest('[data-node]');
 if(!chip)return;
 event.preventDefault();event.dataTransfer.dropEffect='move';
 roots.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
 chip.classList.add('over');
};
roots.ondrop=event=>{
 const chip=event.target.closest('[data-node]');
 if(!draggedRoot||!chip)return;
 event.preventDefault();reorderRoot(draggedRoot,state.roots.indexOf(chip.dataset.node));
 draggedRoot=null;roots.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));
};
roots.ondragend=()=>{draggedRoot=null;roots.querySelectorAll('.over').forEach(el=>el.classList.remove('over'));};
$('rootAdd').onclick=()=>nodeForm({root:true});
$('rootManage').onclick=manageRoots;
$('create').onclick=()=>nodeForm({source:active()});
$('connect').onclick=()=>connectForm(active());
$('back').onclick=()=>step(-1);$('forward').onclick=()=>step(1);
$('scenarios').onclick=scenarioMenu;
$('clear').onclick=()=>openDialog('清空访问记录','将清空底栏中的最近访问记录。','<p class="quiet">下一次打开节点后将重新记录。</p>','清空记录',()=>{state.recent=[];dialog.close();renderNav();persist();toast('最近访问已清空');});
const start=new URLSearchParams(location.search).get('state');
if(['default','empty','isolated','no-results','missing','conflict'].includes(start))loadScenario(start);else render();
</script></body></html>
